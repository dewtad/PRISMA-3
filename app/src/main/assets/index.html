function apPlace(){   /* entre el botón flotante y el último proyecto: 10 px sobre el FAB, donde esté ahora */
  const el=apEl(),f=$('#fab');if(!el||!f)return;
  const b=parseFloat(getComputedStyle(f).bottom);
  el.style.bottom=((isNaN(b)?98:b)+f.offsetHeight+10)+'px';
}
const apPeek=on=>{const el=apEl();if(el){if(on||ap.docked)apPlace();el.classList.toggle('peek',on||ap.docked)}};
const apFill=f=>{const el=apEl();if(!el)return;el.style.setProperty('--fill',f.toFixed(3));el.style.setProperty('--r',(22*f*f*f).toFixed(1)+'px')};
const apUnfill=()=>{const el=apEl();if(!el)return;el.style.removeProperty('--fill');el.style.removeProperty('--r')};
function pullSync(){
  const el=apEl();if(!el)return;
  const show=U.tab==='proyectos'&&!U.reorder;
  el.hidden=!show;
  el.setAttribute('aria-label','Archivo. '+S.archive.length+' proyectos completados');
  el.querySelectorAll('.ap-n').forEach(n=>n.textContent='# '+S.archive.length);
  if(!show)pullReset();
}
function pullReset(){ap.y0=null;ap.docked=false;ap.peeked=false;ap.wacc=0;const el=apEl();if(el){el.classList.remove('peek')}apUnfill()}
function apFire(){
  ap.y0=null;ap.wacc=0;
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
  openArch();
}
function apLevel(px){
  if(px>=AP.FIRE){apFill(1);apFire();return}
  const on=px>=AP.PEEK;ap.peeked=on;apPeek(on);
  if(on)apFill((px-AP.PEEK)/(AP.FIRE-AP.PEEK));else apUnfill();

function apRelease(){

  if(ev&&ev.cancelable)ev.preventDefault();

}

(function(){   /* botón central: toque = acción rápida · pulsación larga (~500 ms) = menú */
  const f=$('#fab');let tm=null,fired=false,x0=0,y0=0;
  const menuTab=()=>(U.tab==='pendientes'||U.tab==='completados')&&!U.reorder;
  const cancel=()=>{if(tm){clearTimeout(tm);tm=null}};
  f.addEventListener('pointerdown',e=>{
    fired=false;cancel();if(!menuTab())return;x0=e.clientX;y0=e.clientY;
    tm=setTimeout(()=>{tm=null;fired=true;if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}U.fo=true;renderFab()},500);
  });
  f.addEventListener('pointermove',e=>{if(tm&&Math.hypot(e.clientX-x0,e.clientY-y0)>10)cancel()});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>f.addEventListener(n,cancel));
  f.addEventListener('contextmenu',e=>e.preventDefault());
  f.addEventListener('click',e=>{if(fired){fired=false;e.stopImmediatePropagation();e.preventDefault()}},true);
})();
/* Deslizar a la izquierda sobre una tarea retrasada la elimina (resumen lateral y pantalla de Tareas pendientes) */
(function(){
  let s=null,sup=false;
  document.addEventListener('pointerdown',e=>{
    const li=e.target.closest&&e.target.closest('li[data-swipe]');if(!li||(e.pointerType==='mouse'&&e.button!==0))return;
    s={li,inn:li.querySelector('.sw-in'),x:e.clientX,y:e.clientY,pid:e.pointerId,dx:0,on:false};
  });
  document.addEventListener('pointermove',e=>{
    if(!s||e.pointerId!==s.pid)return;
    const dx=e.clientX-s.x,dy=e.clientY-s.y;
    if(!s.on){
      if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){s=null;return}
      if(dx<-12&&Math.abs(dx)>Math.abs(dy)*1.5)s.on=true;else return;
    }
    s.dx=Math.min(0,dx);s.inn.style.transform=`translateX(${s.dx}px)`;s.li.style.setProperty('--w',-s.dx+'px');
  });
  const end=ok=>{
    if(!s)return;const q=s;s=null;
    if(!q.on)return;
    sup=true;setTimeout(()=>{sup=false},350);
    const W=q.li.offsetWidth;
    if(ok&&q.dx<-Math.min(110,W*.36)){
      if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
      const a=q.inn.animate([{transform:`translateX(${q.dx}px)`},{transform:`translateX(${-W}px)`}],{duration:150,easing:'ease-in',fill:'forwards'});
      q.li.style.setProperty('--w',W+'px');
      a.finished.catch(()=>{}).then(()=>delTaskSwipe(q.li.dataset.swipe));
    }else{
      q.inn.animate([{transform:`translateX(${q.dx}px)`},{transform:'none'}],{duration:180,easing:'ease-out'});
      q.inn.style.transform='';q.li.style.setProperty('--w','0px');
    }
  };
  document.addEventListener('pointerup',()=>end(true));
  document.addEventListener('pointercancel',()=>end(false));
  document.addEventListener('click',e=>{if(sup){e.stopPropagation();e.preventDefault()}},true);
})();

/* Sobre-desplazamiento en 2 etapas desde el tope: ≥PEEK px muestra "Reorganizar" (se cancela al soltar);
   ≥FIRE px da un tick háptico y activa el modo reorganizar */
(function(){
  const sc=$('#screen'),PEEK=75,FIRE=270;   /* paso 1: 75 px (aparece la pastilla) · paso 2: 270 px (llenado 100% → activa) */
  let y0=null,wacc=0,wt=0,mdown=false;
  const can=()=>(U.tab==='proyectos'||U.tab==='pendientes')&&!U.reorder&&!$('#layer').classList.contains('open');
  const pill=()=>$('#roPill');
  const peek=on=>{const r=$('#subrow');if(r)r.classList.toggle('peek',on)};
  const fill=f=>{const p=pill();if(!p)return;p.style.setProperty('--fill',f.toFixed(3));p.style.setProperty('--r',(18*f*f*f).toFixed(1)+'px')};
  const unfill=()=>{const p=pill();if(!p)return;p.style.removeProperty('--fill');p.style.removeProperty('--r')};
  function fire(){
    y0=null;wacc=0;peek(false);
    if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
    setReorder(true);unfill();
  }
  function release(){y0=null;wacc=0;peek(false);unfill()}
  function level(px){
    if(px>=FIRE){fill(1);fire();return}
    const on=px>=PEEK;peek(on);
    if(on)fill((px-PEEK)/(FIRE-PEEK));else unfill();
  }
  function move(y,ev){
    if(y0==null)return;
    if(sc.scrollTop>0){release();return}
    const dy=y-y0;
    if(dy<=0){peek(false);return}
    if(ev&&ev.cancelable)ev.preventDefault();
    level(dy);
  }
  sc.addEventListener('touchstart',e=>{if(can()&&sc.scrollTop<=0&&e.touches.length===1)y0=e.touches[0].clientY},{passive:true});
  sc.addEventListener('touchmove',e=>{if(y0!=null)move(e.touches[0].clientY,e)},{passive:false});
  sc.addEventListener('touchend',()=>{if(y0!=null)release()});
  sc.addEventListener('touchcancel',()=>{if(y0!=null)release()});
  sc.addEventListener('mousedown',e=>{if(e.button===0&&can()&&sc.scrollTop<=0&&!e.target.closest('button,input,textarea,a,select,.proj,.cats')){y0=e.clientY;mdown=true}});
  document.addEventListener('mousemove',e=>{if(mdown)move(e.clientY,e)});
  document.addEventListener('mouseup',()=>{if(mdown){mdown=false;if(y0!=null)release()}});
  sc.addEventListener('wheel',e=>{
    if(!can()||sc.scrollTop>0||e.deltaY>=0){wacc=0;return}
    wacc+=-e.deltaY;level(wacc*.9);
    clearTimeout(wt);wt=setTimeout(release,200);
  },{passive:true});
  window.addEventListener('resize',hdrShift);
})();
